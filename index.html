document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target, now = Date.now();
  const atOf = pre => { const v = fromInput(f.querySelector("#" + pre + "at").value); return isFinite(v) ? Math.min(v, now) : now; };
  const apxOf = pre => Number(f.querySelector("#" + pre + "apx").value) || 0;
  if(f.id === "f-edit"){
    const pot = POTS.find(p => p.id === V.data.id); if(!pot) return;
    const name = f.querySelector("#e-name").value.trim(); if(!name){ f.querySelector("#e-name").focus(); return; }
    const info = readClayInfo(f, "e-"); if(info.error){ toast(info.error); return; }
    const cnt = parseInt(f.querySelector("#e-count").value, 10);
    const c = {...JSON.parse(JSON.stringify(pot)), name, kind:radio(f, "e-kind") || pot.kind, count:isFinite(cnt) ? cnt : null, note:f.querySelector("#e-note").value.trim(), ...info};
    if(f.querySelector("#e-lab")){
      if(f.querySelector("#e-lab").checked){ c.lab = true; c.exp = f.querySelector("#e-exp").value.trim() || c.exp || "실험"; }
      else delete c.lab;
      for(const [sel, key] of [["#e-w0", "w0"], ["#e-base", "baseMm"], ["#e-dry", "dryG"]]){ const v = numIn(f, sel); if(v) c[key] = v; else delete c[key]; }
    }
    closeSheet(); await savePot(c); toast("기물 정보를 바꿨어요. 예측을 다시 계산했어요."); return;
  }
  if(f.id === "f-visits"){
    const rules = [];
    for(const d of DOW_ORDER){
      if(!f.querySelector("#vd-" + d).checked) continue;
      const st = f.querySelector("#vs-" + d).value, en = f.querySelector("#ve-" + d).value;
      if(!st || !en || en <= st){ toast(`${WD[d]}요일 끝나는 시간이 시작보다 늦어야 해요.`); return; }
      rules.push({dow:d, start:st, end:en});
    }
    lsSet(visitsKey(USER.id), rules); V.planT = null; closeSheet(); render(); toast(rules.length ? "방문 가능 일정을 저장했어요." : "방문 가능 일정을 비웠어요."); return;
  }
  if(f.id === "f-labtrim"){
    const pot = POTS.find(p => p.id === V.data.id); if(!pot) return;
    const c = JSON.parse(JSON.stringify(pot)); c.status = "trimmed";
    const te = {id:uid(), type:"trim", at:Date.now(), note:f.querySelector("#t-note").value.trim()};
    const wb = numIn(f, "#t-wb"), wa = numIn(f, "#t-wa"); if(wb) te.wBefore = wb; if(wa) te.wAfter = wa;
    c.events.push(te); closeSheet(); await savePot(c); toast("굽깎기 완료! 🎉"); return;
  }
  if(f.id === "f-stage"){
    const pot = POTS.find(p => p.id === V.data.id); if(!pot) return;
    const st = STAGES[stageOf(pot)]; if(!st || !st.next) return;
    const c = JSON.parse(JSON.stringify(pot)); c.status = "trimmed";
    let at = atOf("g-"); if(Date.now() - at < 60000) at = Date.now();
    const prevAt = Math.max(0, ...c.events.filter(e => e.type === "trim" || e.type === "stage").map(e => e.at));
    if(at <= prevAt) at = prevAt + 1000;
    const se = {id:uid(), type:"stage", to:st.next, at, approxH:apxOf("g-"), note:f.querySelector("#g-note").value.trim()};
    { const d = numIn(f, "#g-dry"); if(d){ se.dryG = d; c.dryG = d; } }
    c.events.push(se);
    closeSheet(); await savePot(c); toast(`${STAGES[st.next].e} ${STAGES[st.next].lab}! 한 단계 자랐어요.`); return;
  }
  if(f.id === "f-batch"){
    const name = f.querySelector("#b-name").value.trim(); if(!name){ f.querySelector("#b-name").focus(); return; }
    let B = V.data.bid ? BATCHES.find(b => b.id === V.data.bid) : null;
    if(B) B.name = name; else { B = {id:"b" + randHex(6), name, createdAt:now}; BATCHES.push(B); }
    const picked = new Set([...f.querySelectorAll('input[name="b-pot"]:checked')].map(i => i.value));
    POTS.forEach(p => {
      if(picked.has(p.id) && p.batchId !== B.id){ p.batchId = B.id; p.updatedAt = now; }
      else if(!picked.has(p.id) && p.batchId === B.id){ p.batchId = null; p.updatedAt = now; }
    });
    saveBatches(); saveLocal(); closeSheet();
    if(!V.detail) V.batch = B.id;
    render(); toast(`‘${name}’ 묶음을 저장했어요.`); return;
  }
  if(f.id === "f-login"){
    const u = USERS.find(x => x.id === LV.uid); if(!u) return;
    if(Date.now() < LV.lockUntil) return;
    const pin = f.querySelector("#l-pin").value;
    if(await hashPin(u.salt, pin) === u.hash) signIn(u, f.querySelector("#l-keep").checked);
    else {
      LV.fails++;
      if(LV.fails >= 5){ LV.lockUntil = Date.now() + 30000; LV.fails = 0; setTimeout(() => { if(!USER) render(); }, 30100); }
      LV.err = "PIN이 맞지 않아요."; render();
    }
    return;
  }
  if(f.id === "f-signup"){
    const nick = f.querySelector("#u-nick").value.trim(), pin = f.querySelector("#u-pin").value, pin2 = f.querySelector("#u-pin2").value;
    const fail = m => { LV.err = m; render(); const n = document.getElementById("u-nick"); if(n) n.value = nick; };
    if(!nick) return fail("닉네임을 입력해 주세요.");
    if(USERS.some(u => u.nick === nick)) return fail("이 기기에 같은 닉네임이 있어요.");
    if(!/^[0-9]{4}$/.test(pin)) return fail("PIN은 숫자 4자리예요.");
    if(pin !== pin2) return fail("두 PIN이 달라요.");
    const salt = randHex(16), kinds = ["cup","bowl","vase","plate","other"];
    const u = {id:"u" + randHex(8), nick, salt, hash:await hashPin(salt, pin), kind:kinds[USERS.length % kinds.length], createdAt:Date.now()};
    USERS.push(u);
    if(!lsSet(USERS_KEY, USERS)){ USERS.pop(); return fail("이 기기에 저장할 수 없어요. 사파리 개인정보 보호 모드인지 확인해 주세요."); }
    signIn(u, f.querySelector("#u-keep").checked); toast(`${nick}님의 작업실이 열렸어요.`);
    return;
  }
  if(f.id === "f-deluser"){
    const pin = f.querySelector("#d-pin").value;
    if(await hashPin(USER.salt, pin) !== USER.hash){ toast("PIN이 맞지 않아요."); return; }
    lsDel(potsKey(USER.id)); lsDel(batchKey(USER.id)); lsDel(claysKey(USER.id)); USERS = USERS.filter(u => u.id !== USER.id); lsSet(USERS_KEY, USERS);
    V.data = {}; signOut(); toast("사용자와 기록을 삭제했어요."); return;
  }
  if(f.id === "f-add"){
    const prefs0 = lsGet(prefsKey(USER.id), null);
    const kind = radio(f, "a-kind") || "other", n = Math.max(1, Math.min(6, parseInt(radio(f, "a-n") || "1", 10)));
    const info = readClayInfo(f, "a-"); if(info.error){ toast(info.error); return; }
    const st = readStorage(f, "a-");
    const at = atOf("a-"), apx = apxOf("a-"), typed = f.querySelector("#a-name").value.trim(), env = getEnv();
    let bid = f.querySelector("#a-batch").value || null;
    if(bid === "__new" || (!bid && n > 1 && f.querySelector("#a-autob").checked)){
      const d0 = new Date(at), bn = (bid === "__new" && f.querySelector("#a-bnew").value.trim()) || `${d0.getMonth()+1}/${d0.getDate()} ${KIND[kind]} ${n}개`;
      bid = "b" + randHex(6); BATCHES.push({id:bid, name:bn, createdAt:now}); saveBatches();
    }
    const note = f.querySelector("#a-note").value.trim(), names = [];
    const labOn = isLab() && !!(f.querySelector("#a-lab") && f.querySelector("#a-lab").checked);
    const expName = labOn ? (f.querySelector("#a-exp").value.trim() || "실험") : null;
    for(let k = 0; k < n; k++){
      const name = typed ? (n > 1 ? `${typed} ${k + 1}` : typed) : nextAutoName(kind, 0);
      const events = [{id:uid(), type:"storage", at, approxH:apx, ...st}];
      if(env !== "normal") events.push({id:uid(), type:"env", at, env});
      const pot = {id:uid(), name, batchId:bid, kind, ...info, count:null, note, formedAt:at, formedApproxH:apx, status:"active", createdAt:now, updatedAt:now, events};
      if(labOn){ pot.lab = true; pot.exp = expName; const w = numIn(f, `#a-w-${k + 1}`), b = numIn(f, `#a-b-${k + 1}`); if(w) pot.w0 = w; if(b) pot.baseMm = b; }
      POTS.push(pot);
      names.push(name);
    }
    lsSet(prefsKey(USER.id), {kind, clayBodyId:info.clayBodyId, size:info.size, thick:info.thick, clay:info.clay, exp:expName || (prefs0 && prefs0.exp) || undefined});
    closeSheet(); saveLocal(); V.detail = null; V.checkin = null; V.tab = "studio"; render();
    toast(n > 1 ? `${names[0]} 외 ${n - 1}개 탄생! 🏺` : `${names[0]} 탄생! 🏺`); return;
  }
  if(f.id === "f-env"){
    const num = id => { const n = parseFloat(f.querySelector(id).value); return isFinite(n) ? Math.round(n * 10) / 10 : null; };
    const rh = num("#v-rh"), temp = num("#v-temp");
    if(rh != null && (rh < 0 || rh > 100)){ toast("습도는 0~100% 사이로 넣어 주세요."); return; }
    const lv = rh != null ? envOfRH(rh) : (radio(f, "v-lv") || "normal");
    const reading = rh != null || temp != null ? {rh, temp} : null;
    closeSheet(); await setStudioEnv(lv, reading);
    toast(`🌡️ 작업실 공기: ${ENV[lv].lab}${reading ? ` (${readingText(reading)})` : ""}`); return;
  }
  if(f.id === "f-paste"){
    const text = f.querySelector("#p-text").value.trim(); if(!text){ toast("백업 텍스트를 붙여 넣어 주세요."); return; }
    try { const n = importBackup(text); closeSheet(); render(); toast(n ? `기물 ${n}개를 가져왔어요.` : "새로 가져올 기록이 없어요."); }
    catch { toast("Claygotchi 백업 텍스트가 아니에요. 처음부터 끝까지 모두 복사했는지 확인해 주세요."); }
    return;
  }
  if(f.id === "f-obsmore"){
    const pot = POTS.find(p => p.id === V.data.id), ev = pot && pot.events.find(e => e.id === V.data.ev); if(!ev) return;
    ev.rim = radio(f, "m-rim") || "same"; ev.note = f.querySelector("#m-note").value.trim(); pot.updatedAt = Date.now();
    if(f.querySelector("#m-w")){ const w = numIn(f, "#m-w"); if(w) ev.w = w; else delete ev.w; }
    closeSheet(); saveLocal(); render(); toast(ev.w ? `기록했어요 · ${wInfo(pot, ev.w)}` : "기록에 더했어요."); return;
  }
  if(f.id === "f-obs"){
    const level = radio(f, "o-level"); if(!level){ toast("상태를 하나 골라 주세요."); return; }
    const pot = POTS.find(p => p.id === V.data.id); if(!pot) return;
    const at = atOf("o-"), P = predict(pot, at);
    const pred = P.st ? {fast:P.st.fast, mid:P.st.mid, slow:P.st.slow, state:P.state, conf:P.conf} : null;
    const c = JSON.parse(JSON.stringify(pot));
    const pred2 = predSnap(pot, at) || pred, oe = {id:uid(), type:"obs", at, approxH:apxOf("o-"), level, rim:radio(f, "o-rim") || "same", note:f.querySelector("#o-note").value.trim(), pred:pred2};
    { const w = numIn(f, "#o-w"); if(w) oe.w = w; }
    c.events.push(oe);
    closeSheet(); await savePot(c); toast("기록했어요. 예상 구간을 다시 계산했어요.");
  }
  if(f.id === "f-store"){
    const pot = POTS.find(p => p.id === V.data.id); if(!pot) return;
    const c = JSON.parse(JSON.stringify(pot));
    c.events.push({id:uid(), type:"storage", at:atOf("s-"), approxH:apxOf("s-"), ...readStorage(f, "s-")});
    closeSheet(); await savePot(c); toast("보관 방법을 바꿨어요.");
  }
});
setInterval(() => { if(!USER) return; if(document.activeElement && document.activeElement.id === "planT") return; render(); }, 60000);

/* ───────── boot ───────── */
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && USER){ if(!V.sheet) render(); scheduleSync(); } });
async function boot(){
  await restoreFromNative();
  loadUsers();
  const cur = lsGet(CUR_KEY, null), u = USERS.find(x => x.id === cur);
  if(u) signIn(u, true);
  else { LV.mode = USERS.length ? "pick" : "signup"; render(); }
}
boot();
})();
</script>
<script>if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
