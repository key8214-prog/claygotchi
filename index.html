<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claygotchi</title>
<meta name="description" content="기물마다 건조 상태를 추정하고 굽깎기 적정 구간을 알려주는 도예 관리 앱">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claygotchi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1C1A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one phone-width column; studio cards first, detail opens as a full page, forms as bottom sheets. */
:root{
  --ivory:#FBF8F1; --card:#FFFDF9; --beige:#F0E7D8; --beige-2:#E6DAC6;
  --terracotta:#B95E3A; --terracotta-soft:#F3DCCF; --sage:#6F8F6B; --sage-soft:#DCE6D6;
  --charcoal:#2D2A27; --muted:#7A7066; --line:#E5DACA; --urgent:#DB7428; --urgent-soft:#FBE3CF;
  --water:#5F8AA0; --water-soft:#DCE8EE; --unk:#8C8378; --unk-soft:#ECE6DD;
  --clay-wet:#7F533E; --clay-mid:#9E6C50; --clay-mid2:#B4825F; --clay-leather:#C99B76; --clay-dry:#CFC8BE; --clay-unk:#B6A898;
  --rim:rgba(0,0,0,.14); --face:#2D2A27; --blush:#E79A86; --shadow:rgba(60,40,20,.12); --glow:rgba(255,226,160,.55);
  --f-display:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --f-body:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ivory:#1E1C1A; --card:#282522; --beige:#322E2A; --beige-2:#3B3631;
  --terracotta:#DB8560; --terracotta-soft:#4A3329; --sage:#9DB898; --sage-soft:#2F3A2D;
  --charcoal:#EEE7DC; --muted:#A99F93; --line:#3D3833; --urgent:#F0954F; --urgent-soft:#4A3220;
  --water:#8DB4C8; --water-soft:#263640; --unk:#B0A699; --unk-soft:#35312C;
  --rim:rgba(0,0,0,.22); --face:#2D2A27; --shadow:rgba(0,0,0,.35); --glow:rgba(255,214,140,.22);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ivory:#1E1C1A; --card:#282522; --beige:#322E2A; --beige-2:#3B3631;
  --terracotta:#DB8560; --terracotta-soft:#4A3329; --sage:#9DB898; --sage-soft:#2F3A2D;
  --charcoal:#EEE7DC; --muted:#A99F93; --line:#3D3833; --urgent:#F0954F; --urgent-soft:#4A3220;
  --water:#8DB4C8; --water-soft:#263640; --unk:#B0A699; --unk-soft:#35312C;
  --rim:rgba(0,0,0,.22); --face:#2D2A27; --shadow:rgba(0,0,0,.35); --glow:rgba(255,214,140,.22);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--ivory)}
body{color:var(--charcoal);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) 110px}
.linkbtn{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:none;color:var(--terracotta);font-weight:600}
.center{text-align:center}
.login{max-width:380px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4vh}
.login-hero{display:flex;gap:2px;justify-content:center}
.login-title{font-size:32px}
.login form,.login .users{width:100%;display:flex;flex-direction:column;gap:10px}
.user-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.user-btn .ch-wrap{width:44px;border-radius:12px;--tone-soft:var(--beige)}
.user-btn b{font-weight:600;font-size:16px}
.pin-input{font-size:26px!important;letter-spacing:.6em;text-align:center;font-family:var(--f-mono)}
.err{color:var(--urgent);font-size:13px;min-height:1em;margin:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px}
.acct-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.acct-list .btn{justify-content:flex-start;padding:12px 14px;border-radius:14px;width:100%}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:27px;letter-spacing:-.01em}
.brand .tag{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--charcoal);color:var(--ivory);border-color:var(--charcoal)}
.btn.terra{background:var(--terracotta);color:#fff;border-color:var(--terracotta)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}

/* summary */
.summary{background:var(--beige);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.summary .q{font-family:var(--f-display);font-size:17px}
.summary .next{display:flex;gap:12px;align-items:center}
.summary .next .when{font-size:20px;font-family:var(--f-display)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* cards */
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:78px 1fr;gap:4px 12px;cursor:pointer;text-align:left;width:100%}
.card .ch{grid-row:1/3;align-self:start}
.card .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.card .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .nm b{font-weight:600;font-size:15.5px}
.card .msg{font-family:var(--f-display);font-size:17.5px;line-height:1.3}
.card .win{font-size:13.5px}
.card .win .lab{color:var(--muted);font-size:12px}
.card .meta{grid-column:1/3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.card .meta div{min-width:0}
.card .meta .k{font-size:11px;color:var(--muted);letter-spacing:.03em}
.card .meta .v{font-size:12.5px;overflow-wrap:anywhere}
.card .acts{grid-column:1/3;display:flex;gap:8px;margin-top:4px}
.card .acts .btn{flex:1;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.pred{background:var(--beige);color:var(--muted)}
.pill.obs{background:var(--sage-soft);color:var(--sage)}
.conf-mid{color:var(--sage)} .conf-low{color:var(--terracotta)} .conf-vlow,.conf-none{color:var(--urgent)}
.countdown{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}

.st-WET{--tone:var(--water);--tone-soft:var(--water-soft)}
.st-DRYING{--tone:var(--sage);--tone-soft:var(--sage-soft)}
.st-APPROACHING{--tone:var(--sage);--tone-soft:var(--sage-soft)}
.st-READY{--tone:var(--terracotta);--tone-soft:var(--terracotta-soft)}
.st-URGENT{--tone:var(--urgent);--tone-soft:var(--urgent-soft)}
.st-OVERDRIED{--tone:var(--unk);--tone-soft:var(--unk-soft)}
.st-UNKNOWN{--tone:var(--unk);--tone-soft:var(--unk-soft)}
.st-TRIMMED{--tone:var(--sage);--tone-soft:var(--sage-soft)}
.card.st-URGENT{border-color:var(--urgent);box-shadow:0 0 0 3px var(--urgent-soft)}
.card.st-READY{border-color:var(--terracotta)}
.ch-wrap{border-radius:16px;background:var(--tone-soft);display:grid;place-items:center;aspect-ratio:1;max-width:100%}
.nodata{border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px;font-size:13px;background:repeating-linear-gradient(135deg,transparent 0 8px,var(--beige) 8px 9px)}
.paused{border-radius:12px;padding:8px 10px;font-size:13px;background:var(--water-soft)}

.section-h{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.section-h h2{font-size:19px}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--ivory) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tab{border:0;background:transparent;border-radius:14px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted)}
.tab .ic{font-size:18px;line-height:1}
.tab[aria-current="page"]{background:var(--beige);color:var(--charcoal);font-weight:500}

/* detail */
.detail-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 0 16px}
.hero .ch-wrap{width:170px;border-radius:40px}
.hero h2{font-size:24px}
.hero .msg{font-family:var(--f-display);font-size:21px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.panel h3{font-size:16px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv .k{color:var(--muted);font-size:13px}
.kv .v{min-width:0}
.window-big{display:flex;flex-direction:column;gap:4px}
.window-big .range{font-family:var(--f-display);font-size:19px}
.chart-wrap{overflow-x:auto;margin:0 -4px}
.chart-wrap svg{display:block;width:100%;height:auto;min-width:300px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:16px;height:8px;border-radius:3px;margin-right:4px;vertical-align:middle}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px 18px 1fr auto;gap:0 8px;align-items:start;min-height:44px}
.tl .t{font-size:12px;color:var(--muted);text-align:right;padding-top:2px}
.tl .rail{position:relative;height:100%;display:flex;justify-content:center}
.tl .rail::before{content:"";position:absolute;top:14px;bottom:-4px;width:2px;background:var(--charcoal);opacity:.35}
.tl li.future .rail::before{background:none;border-left:2px dashed var(--muted);opacity:.6;width:0}
.tl li:last-child .rail::before{display:none}
.tl .nd{width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--charcoal);margin-top:4px;z-index:1}
.tl li.future .nd{border-style:dashed;border-color:var(--muted)}
.tl .tx{font-size:14px;padding-bottom:12px;min-width:0}
.tl .tx .sub{font-size:12.5px;color:var(--muted)}
.icon-btn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:8px}
.sticky-acts{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:10px;background:var(--beige);border-radius:18px;margin-top:8px;z-index:5}
.sticky-acts .btn{flex:1;justify-content:center}
.note{font-size:13px;color:var(--muted);background:var(--beige);border-radius:12px;padding:10px 12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,22,16,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ivory);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:21px;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field>label,.field>.lab{font-size:13px;font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],select,textarea{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--charcoal);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer}
.seg input:checked+label{background:var(--charcoal);color:var(--ivory);border-color:var(--charcoal)}
.seg input:focus-visible+label{outline:2px solid var(--terracotta);outline-offset:2px}
.obs-opts{display:flex;flex-direction:column;gap:8px}
.obs-opts input{position:absolute;opacity:0;pointer-events:none}
.obs-opts label{display:grid;grid-template-columns:28px 1fr;gap:2px 8px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;cursor:pointer}
.obs-opts label .e{grid-row:1/3;font-size:20px}
.obs-opts label .s{font-size:12.5px;color:var(--muted)}
.obs-opts input:checked+label{border-color:var(--terracotta);box-shadow:0 0 0 2px var(--terracotta-soft)}
.obs-opts input:focus-visible+label{outline:2px solid var(--terracotta)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet-acts{display:flex;gap:8px;margin-top:20px}
.sheet-acts .btn{flex:1;justify-content:center;padding:12px}
.hint{font-size:12.5px;color:var(--muted)}

/* planner */
.plan-item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.plan-head{display:flex;gap:10px;align-items:center}
.plan-head .ch-wrap{width:48px;border-radius:12px}
.opt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--line);align-items:center}
.opt .nm{font-size:13.5px;min-width:0}
.opt .sub{font-size:12px;color:var(--muted);grid-column:1/3}
.tri{display:inline-flex;gap:3px}
.tri span{width:26px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--tone-soft);color:var(--tone)}
.verdict{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.v-good{background:var(--sage-soft);color:var(--sage)} .v-maybe{background:var(--terracotta-soft);color:var(--terracotta)} .v-unsure{background:var(--unk-soft);color:var(--unk)} .v-no{background:var(--beige);color:var(--muted)}

/* lab */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
details.exp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details.exp summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.exp summary::-webkit-details-marker{display:none}
details.exp[open] summary{margin-bottom:8px}
details.exp ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.grade{font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.g-ok{background:var(--sage-soft);color:var(--sage)} .g-est{background:var(--terracotta-soft);color:var(--terracotta)} .g-unk{background:var(--unk-soft);color:var(--unk)}
.dex{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dex .it{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11.5px}
.dex .ch-wrap{width:100%}
.facts{display:grid;grid-template-columns:1fr;gap:12px}
.facts ol{margin:0;padding-left:20px;font-size:13.5px}

.empty{text-align:center;padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .row{justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--charcoal);color:var(--ivory);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.confirm-box{background:var(--urgent-soft);border-radius:12px;padding:10px;margin-top:10px;font-size:13.5px}

/* character motion (subtle) */
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes breeze{0%{transform:translateX(-4px);opacity:0}40%{opacity:.9}100%{transform:translateX(6px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1);opacity:1}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
@keyframes floatz{0%{transform:translate(0,0);opacity:0}30%{opacity:.9}100%{transform:translate(6px,-12px);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.pot .drip{animation:drip 2.6s ease-in infinite;transform-box:fill-box}
.pot .breeze{animation:breeze 3.2s ease-in-out infinite}
.pot .tw{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pot .wob{animation:wobble 1.4s ease-in-out infinite;transform-origin:60px 100px}
.pot .zz{animation:floatz 3s ease-out infinite}
.pot .bob{animation:bob 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pot *{animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(() => {
"use strict";
const H = 36e5, DAY = 24 * H;

/* ───────── vocabulary ───────── */
const KIND = {cup:"컵", bowl:"보울", plate:"접시", vase:"화병", other:"기타"};
const CLAY = {
  wet:{lab:"수분 많음", p:{lo:-20, mid:-14, hi:-8}},
  normal:{lab:"일반", p:{lo:-2, mid:0, hi:2}},
  unknown:{lab:"모름", p:{lo:-20, mid:-6, hi:2}}
};
const THICK = {
  thin:{lab:"얇음", lo:.7, mid:.8, hi:.9},
  normal:{lab:"보통", lo:.9, mid:1, hi:1.1},
  thick:{lab:"두꺼움", lo:1.2, mid:1.35, hi:1.6},
  unknown:{lab:"모름", lo:.75, mid:1, hi:1.5}
};
/* Thresholds in "open-air hours for normal clay". R1 kept under EXP-003's 36–40h over-dry observation. */
const R0R = {lo:14, mid:18, hi:24}, R1R = {lo:24, mid:28, hi:34};
const CONT = {none:"오픈에어", box:"박스", styro:"스티로폼 박스", plastic:"플라스틱 박스", vinyl:"비닐 덮개", unknown:"기록 없음"};
const SEAL = {partial:"부분 개방", closed:"덮개 닫음", sealed:"완전 밀폐", unknown:"모름"};
const ORIENT = {up:"바로 놓음", flip:"뒤집음", unknown:"모름"};

function rateOf(st){
  if(!st) return {lo:0, mid:.4, hi:1.1, ev:"보관 기록 없음", grade:"unk"};
  const c = st.container, s = st.seal;
  if(c === "none") return {lo:.8, mid:1, hi:1.25, ev:"EXP-003: 일반 흙 36~40h 노출 시 과건조", grade:"ok"};
  if(c === "unknown" || s === "unknown") return {lo:0, mid:.4, hi:1.1, ev:"보관 조건이 기록되지 않음", grade:"unk"};
  if(s === "sealed"){
    if(c === "plastic") return {lo:0, mid:.02, hi:.05, ev:"EXP-004: 7일 후에도 거의 그대로", grade:"ok"};
    if(c === "styro") return {lo:0, mid:.04, hi:.1, ev:"추정 · EXP-002 결과 대기 중", grade:"est"};
    if(c === "vinyl") return {lo:.01, mid:.06, hi:.15, ev:"추정 · 실험 없음", grade:"est"};
    return {lo:.03, mid:.12, hi:.3, ev:"추정 · 종이 박스는 수분을 흡수할 수 있음", grade:"est"};
  }
  if(s === "closed") return {lo:.05, mid:.2, hi:.4, ev:"추정 · 실험 없음", grade:"est"};
  return {lo:.15, mid:.35, hi:.6, ev:"추정 · EXP-002 결과 대기 중", grade:"est"};
}

const RANK2ST = ["WET","DRYING","APPROACHING","READY","URGENT","OVERDRIED"];
const SORT = {URGENT:0, READY:1, APPROACHING:2, UNKNOWN:3, DRYING:4, WET:5, OVERDRIED:6, TRIMMED:7};
const CONF = {mid:"보통", low:"낮음", vlow:"매우 낮음", none:"예측 불가"};

/* ───────── model ───────── */
const SC = ["fast","mid","slow"];
/* Each factor's fast/slow uses 55% of its range: independent errors rarely all hit their extremes at once. */
const SPREAD_K = .55;
const pick = (r, s, up = true) => s === "mid" ? r.mid : ((s === "fast") === up ? r.mid + SPREAD_K * (r.hi - r.mid) : r.mid - SPREAD_K * (r.mid - r.lo));
const byAt = (a, b) => a.at - b.at;
const storages = p => (p.events || []).filter(e => e.type === "storage").sort(byAt);
const observations = p => (p.events || []).filter(e => e.type === "obs").sort(byAt);
const currentStorage = (p, t = Date.now()) => storages(p).filter(e => e.at <= t).pop() || storages(p)[0] || null;

function scenario(pot, s, now = Date.now()){
  const th = THICK[pot.thick] || THICK.unknown;
  const tf = pick(th, s, false);
  const R0 = pick(R0R, s, false) * tf, R1 = pick(R1R, s, false) * tf;
  const anchors = observations(pot).filter(o => OBS[o.level] && !OBS[o.level].terminal);
  const last = anchors[anchors.length - 1];
  let anchorT, approx, p0;
  if(last){
    anchorT = last.at; approx = (last.approxH || 0) * H;
    const L = OBS[last.level];
    p0 = L.kind === "f" ? pick(L.r, s) * R0 : R0 + pick(L.r, s) * (R1 - R0);
  } else {
    anchorT = pot.formedAt; approx = (pot.formedApproxH || 0) * H;
    p0 = pick((CLAY[pot.clay] || CLAY.unknown).p, s);
  }
  let t0 = s === "fast" ? anchorT - approx : s === "slow" ? anchorT + approx : anchorT;
  t0 = Math.min(t0, Math.max(now, anchorT));
  const st = storages(pot);
  const segs = st.length ? st.map(e => ({t:e.at, rate:pick(rateOf(e), s) / H})) : [{t:pot.formedAt, rate:pick(rateOf(null), s) / H}];
  return {R0, R1, t0, p0, segs};
}
function cum(sc, T){
  const s = sc.segs; let acc = 0;
  for(let i = 0; i < s.length; i++){
    const a = s[i].t, b = i + 1 < s.length ? s[i + 1].t : Infinity;
    if(i === 0){ const end = Math.min(T, b); acc += s[0].rate * (end - a); if(T <= b) return acc; }
    else { if(T <= a) return acc; acc += s[i].rate * (Math.min(T, b) - a); }
  }
  return acc;
}
const pAt = (sc, T) => sc.p0 + cum(sc, T) - cum(sc, sc.t0);
function crossT(sc, target){
  let lo = sc.t0 - 40 * DAY, hi = sc.t0 + 60 * DAY;
  if(pAt(sc, hi) < target) return Infinity;
  if(pAt(sc, lo) >= target) return lo;
  for(let i = 0; i < 48; i++){ const m = (lo + hi) / 2; if(pAt(sc, m) >= target) hi = m; else lo = m; }
  return hi;
}
const qOf = (p, R0, R1) => p < R0 ? p / R0 : 1 + (p - R0) / (R1 - R0);
const stOfQ = q => q < .55 ? "WET" : q < .85 ? "DRYING" : q < 1 ? "APPROACHING" : q < 1.75 ? "READY" : q < 2 ? "URGENT" : "OVERDRIED";

function statesAt(pot, T, now = Date.now()){
  const o = {};
  for(const s of SC){ const sc = scenario(pot, s, now); o[s] = stOfQ(qOf(pAt(sc, T), sc.R0, sc.R1)); }
  return o;
}

function predict(pot, now = Date.now()){
  const obs = observations(pot), lastObs = obs[obs.length - 1] || null;
  if(pot.status === "trimmed") return {state:"TRIMMED", terminal:true, lastObs};
  if(lastObs && lastObs.level === "over") return {state:"OVERDRIED", terminal:true, observed:true, lastObs};
  const sc = {}, q = {}, st = {}, tS = {}, tE = {};
  for(const s of SC){
    sc[s] = scenario(pot, s, now);
    q[s] = qOf(pAt(sc[s], now), sc[s].R0, sc[s].R1);
    st[s] = stOfQ(q[s]);
    tS[s] = crossT(sc[s], sc[s].R0);
    tE[s] = crossT(sc[s], sc[s].R1);
  }
  const cur = currentStorage(pot, now), rate = rateOf(cur);
  const spreadH = now < tS.mid ? (tS.slow - tS.fast) / H : (tE.slow - tE.fast) / H;
  let conf = !isFinite(spreadH) || spreadH > 36 ? "none" : spreadH > 18 ? "vlow" : spreadH > 6 ? "low" : "mid";
  const diff = ST[st.fast].r - ST[st.slow].r;
  let state = diff >= 3 ? "UNKNOWN" : st.mid;
  const paused = rate.mid <= .05;
  const recentObs = lastObs && now - lastObs.at < 3 * H && !(lastObs.approxH > 0);
  return {state, st, q, tS, tE, conf, spreadH, paused, cur, rate, lastObs, recentObs, sc};
}
function whatIf(pot, changes){
  const c = JSON.parse(JSON.stringify(pot));
  for(const ch of changes) c.events.push({type:"storage", id:"tmp", ...ch});
  return c;
}

const pad = n => String(n).padStart(2, "0");
function fmt(ms, approxH = 0){
  if(!isFinite(ms)) return "—";
  const d = new Date(ms);
  const day = `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`;
  if(approxH >= 6) return `${day} · 시간 미기록`;
  return `${day} ${pad(d.getHours())}:${pad(d.getMinutes())}${approxH > 0 ? " 쯤" : ""}`;
}
function fmtShort(ms){ const d = new Date(ms); return `${WD[d.getDay()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dur(ms){
  ms = Math.max(0, ms);
  const d = Math.floor(ms / DAY), h = Math.floor((ms % DAY) / H), m = Math.floor((ms % H) / 6e4);
  if(d > 0) return `${d}일 ${h}시간`;
  if(h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}

const USERS_KEY = "claygotchi.users.v1", CUR_KEY = "claygotchi.current.v1";
let USERS = [], USER = null, POTS = [], MODE = "local", READONLY = false;
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
const potsKey = id => "claygotchi.pots." + id;
async function hashPin(salt, pin){
  const str = salt + ":" + pin;
  try {
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch {}
  let h = 2166136261; for(const ch of str){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return "f" + h.toString(16);
}
function randHex(n){
  const a = new Uint8Array(n);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for(let i = 0; i < n; i++) a[i] = Math.random() * 256 | 0;
  return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
}
function loadUsers(){ USERS = lsGet(USERS_KEY, []); if(!Array.isArray(USERS)) USERS = []; }
function signIn(u, keep){
  USER = u; POTS = lsGet(potsKey(u.id), []);
  if(keep) lsSet(CUR_KEY, u.id); else lsDel(CUR_KEY);
  V.tab = "studio"; V.detail = null; LV.err = ""; LV.fails = 0;
  render(); window.scrollTo(0, 0);
}
function signOut(){
  USER = null; POTS = []; lsDel(CUR_KEY); closeSheet();
  LV.mode = USERS.length ? "pick" : "signup"; LV.err = "";
  render();
}
function saveLocal(){ if(USER && !lsSet(potsKey(USER.id), POTS)) toast("기기 저장 공간이 부족해 저장하지 못했어요."); }
async function savePot(p){
  p.updatedAt = Date.now();
  const i = POTS.findIndex(x => x.id === p.id);
  if(i >= 0) POTS[i] = p; else POTS.push(p);
  saveLocal(); render();
  return true;
}
async function removePot(id){ POTS = POTS.filter(p => p.id !== id); saveLocal(); render(); }

const V = {tab:"studio", detail:null, sheet:null, data:{}, showDone:false, planT:null, confirmDel:false, delEvent:null};
const $app = document.getElementById("app"), $sheet = document.getElementById("sheet");
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.innerHTML = "", 2600);
}

/* ───────── pieces ───────── */
function confPill(P){
  if(P.terminal) return P.state === "TRIMMED" ? `<span class="pill obs">기록 완료</span>` : `<span class="pill obs">직접 확인</span>`;
  if(P.recentObs) return `<span class="pill obs">방금 직접 확인</span>`;
  if(P.paused) return `<span class="pill pred">예상 · 밀폐 보관 중</span>`;
  return `<span class="pill pred">예상 · 신뢰도 <b class="conf-${P.conf}">${CONF[P.conf]}</b></span>`;
}
function windowBlock(pot, P, now, big = false){
  if(P.terminal) return P.state === "TRIMMED" ? `<div class="win muted small">굽깎기를 마쳤어요.</div>` : `<div class="win muted small">직접 확인한 과건조 상태예요. 굽깎기 적정 구간이 지났어요.</div>`;
  if(P.paused && now < P.tS.mid){
    const alt = predict(whatIf(pot, [{at:now, container:"none", seal:"partial", orient:"unknown"}]), now);
    const a = alt.tS.fast - now, b = alt.tS.slow - now;
    return `<div class="paused"><b>💤 밀폐 보관 중이라 건조가 거의 멈춰 있어요.</b><br>
      <span class="small">지금 꺼내 오픈에어로 두면 ${a <= 0 ? "빠른 경우 이미 적정일 수 있고" : `빠르면 <span class="mono">${dur(a)}</span>`}, 늦으면 <span class="mono">${isFinite(b) ? dur(b) : "?"}</span> 뒤 적정 구간에 들어설 것으로 봐요.</span></div>`;
  }
  if(P.conf === "none"){
    const early = isFinite(P.tS.fast) && P.tS.fast > now ? `<br><span class="xs">가장 빠른 경우 ${fmt(P.tS.fast)}쯤부터 가능성이 있어요.</span>` : "";
    return `<div class="nodata">아직 데이터가 부족해서 굽깎기 시간을 예측할 수 없어요.${early}</div>`;
  }
  const s = P.tS.mid, e = P.tE.mid;
  let cd;
  if(now < s) cd = `⏳ 예상 시작까지 ${dur(s - now)}`;
  else if(now < e) cd = `⌛ 예상 종료까지 ${dur(e - now)}`;
  else cd = `예상 구간이 ${dur(now - e)} 전에 지났어요`;
  const range = `${fmt(s)} ~ ${fmt(e)}`;
  if(big) return `<div class="window-big"><span class="eyebrow">예상 굽깎기 최적 구간</span><span class="range">${range}</span>
    <span class="countdown">${cd}</span><span class="small muted">빠르면 ${fmt(P.tS.fast)} 시작 · 늦으면 ${fmt(P.tS.slow)} 시작 (시작 시점 차이 약 ${Math.round(P.spreadH)}시간)</span></div>`;
  return `<div class="win"><div class="lab">예상 최적 구간</div><div>${range}</div><div class="countdown">${cd}</div></div>`;
}
function lastObsText(P, now){
  if(!P.lastObs) return "기록 없음";
  const o = P.lastObs;
  return `${o.approxH >= 6 ? fmt(o.at, o.approxH) : ago(o.at, now)} · ${OBS[o.level] ? OBS[o.level].lab : ""}`;
}
function card(pot, now){
  const P = predict(pot, now);
  const s = P.state;
  return `<article class="card st-${s}" tabindex="0" role="button" data-act="open" data-id="${esc(pot.id)}" aria-label="${esc(pot.name)} 상세 보기">
    <div class="ch"><div class="ch-wrap">${potSVG(pot.kind, s, {paused:P.paused})}</div></div>
    <div class="body">
      <div class="nm"><b>${esc(pot.name)}</b><span class="xs muted">${KIND[pot.kind] || "기타"}${pot.count ? " · " + pot.count + "개" : ""}</span></div>
      <div class="msg">${ST[s].e} ${ST[s].msg}</div>
      <div>${confPill(P)}</div>
      ${windowBlock(pot, P, now)}
    </div>
    <div class="meta">
      <div><div class="k">성형 후</div><div class="v mono">${pot.formedApproxH >= 6 ? "약 " : ""}${dur(now - pot.formedAt)}</div></div>
      <div><div class="k">현재 보관</div><div class="v">${esc(storageLabel(P.cur || currentStorage(pot, now)))}</div></div>
      <div><div class="k">마지막 확인</div><div class="v">${esc(lastObsText(P, now))}</div></div>
    </div>
    ${pot.status === "trimmed" ? "" : `<div class="acts"><button class="btn sm" data-act="obs" data-id="${esc(pot.id)}">상태 기록하기</button><button class="btn sm" data-act="store" data-id="${esc(pot.id)}">보관 방법 변경</button></div>`}
  </article>`;
}

/* ───────── screens ───────── */
function studio(now){
  const active = POTS.filter(p => p.status !== "trimmed");
  const done = POTS.filter(p => p.status === "trimmed");
  const preds = active.map(p => ({p, P:predict(p, now)}));
  preds.sort((a, b) => (SORT[a.P.state] - SORT[b.P.state]) || ((a.P.tS?.mid ?? Infinity) - (b.P.tS?.mid ?? Infinity)));
  const head = `<header class="top"><div class="brand"><span class="eyebrow">My Pottery Studio · <button class="linkbtn" data-act="account" aria-label="계정 메뉴">${esc(USER ? USER.nick : "")}님 ▾</button></span><h1>Claygotchi</h1><span class="tag">내 기물들은 지금 어떤 상태이고, 언제 가면 될까?</span></div>
    <button class="btn primary" data-act="add" ${READONLY ? "disabled" : ""}>＋ 기물 등록</button></header>`;
  if(MODE === "loading") return head + `<div class="empty"><div style="width:120px">${potSVG("bowl","UNKNOWN",{paused:true})}</div><p class="muted">작업실을 불러오는 중이에요…</p></div>`;
  if(!POTS.length) return head + `<div class="empty">
      <div class="row" style="gap:4px">${["cup","bowl","vase"].map(k => `<div style="width:84px">${potSVG(k,"UNKNOWN",{paused:true})}</div>`).join("")}</div>
      <h2 style="font-size:20px">아직 작업실이 비어 있어요</h2>
      <p class="muted small" style="max-width:300px">오늘 성형한 기물을 등록하면 기물마다 상태 카드가 생겨요. 실험 노트의 EXP-002 기물도 바로 가져올 수 있어요.</p>
      <div class="row"><button class="btn primary" data-act="add">＋ 첫 기물 등록</button><button class="btn" data-act="import">EXP-002 기물 가져오기</button></div></div>`;

  // summary
  const ready = preds.filter(x => ["READY","URGENT"].includes(x.P.state));
  const cands = preds.filter(x => !x.P.terminal && !x.P.paused && x.P.conf !== "none" && isFinite(x.P.tS.mid) && x.P.tE.mid > now).sort((a, b) => a.P.tS.mid - b.P.tS.mid);
  const need = preds.filter(x => x.P.state === "UNKNOWN" || (!x.P.terminal && !x.P.paused && x.P.conf === "none"));
  const counts = {};
  preds.forEach(x => { if(x.P.state !== "UNKNOWN") counts[x.P.state] = (counts[x.P.state] || 0) + 1; });
  let nextHtml;
  if(ready.length) nextHtml = `<div class="next"><div style="width:52px">${potSVG(ready[0].p.kind, ready[0].P.state, {still:true})}</div><div><div class="when">지금 적정 구간일 수 있어요</div><div class="small muted">${ready.map(x => esc(x.p.name)).join(", ")} · 출발 전 예상 종료 시각을 확인하세요</div></div></div>`;
  else if(cands.length){ const c = cands[0]; nextHtml = `<div class="next"><div style="width:52px">${potSVG(c.p.kind, c.P.state, {still:true})}</div><div><div class="eyebrow">가장 빠른 굽깎기 예상</div><div class="when">${fmt(c.P.tS.mid)}</div><div class="small muted">${esc(c.p.name)} · 신뢰도 ${CONF[c.P.conf]}</div></div></div>`; }
  else nextHtml = `<div class="small">아직 믿을 만한 굽깎기 예상 시점이 없어요. ${need.length ? `<b>${need.length}개</b> 기물의 실제 상태를 기록하면 예측이 좁혀져요.` : ""}</div>`;
  const chipHtml = Object.keys(counts).sort((a, b) => SORT[a] - SORT[b]).map(k => `<span class="chip st-${k}"><span class="dot" style="background:var(--tone)"></span>${ST[k].lab} ${counts[k]}</span>`).join("");
  const summary = `<section class="summary" aria-label="작업실 요약"><div class="q">관리 중인 기물 ${active.length}개</div>${nextHtml}<div class="chips">${chipHtml}${need.length ? `<span class="chip">❓ 관찰 필요 ${need.length}</span>` : ""}</div></section>`;
  const list = `<div class="list">${preds.map(x => card(x.p, now)).join("")}</div>`;
  const doneHtml = done.length ? `<div class="section-h"><h2>완료한 기물</h2><button class="btn sm ghost" data-act="toggleDone">${V.showDone ? "접기" : `${done.length}개 보기`}</button></div>${V.showDone ? `<div class="list">${done.map(p => card(p, now)).join("")}</div>` : ""}` : "";
  const modeNote = "";
  return head + summary + (active.length ? list : `<p class="muted">관리 중인 기물이 없어요.</p>`) + doneHtml + modeNote;
}

function chartSVG(pot, P, now){
  const W = 340, Hh = 176, L = 40, R = 10, T = 12, B = 30;
  const t0 = pot.formedAt;
  let t1 = now + 30 * H;
  if(!P.terminal && isFinite(P.tE.mid)) t1 = Math.max(t1, Math.min(P.tE.mid + 12 * H, t0 + 12 * DAY));
  t1 = Math.min(Math.max(t1, now + 12 * H), Math.max(t0 + 12 * DAY, now + 12 * H));
  const QMAX = 2.4;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = q => T + (1 - Math.max(0, Math.min(QMAX, q)) / QMAX) * (Hh - T - B);
  const N = 90, pts = {fast:[], mid:[], slow:[]};
  const sc = P.sc || {};
  for(let i = 0; i <= N; i++){
    const t = t0 + (t1 - t0) * i / N;
    for(const s of SC){ if(sc[s]) pts[s].push([t, qOf(pAt(sc[s], t), sc[s].R0, sc[s].R1)]); }
  }
  let g = "";
  g += `<rect x="${L}" y="${y(2)}" width="${W-L-R}" height="${y(1)-y(2)}" fill="var(--sage-soft)"/>`;
  g += `<rect x="${L}" y="${y(2)}" width="${W-L-R}" height="${y(1.75)-y(2)}" fill="var(--urgent-soft)"/>`;
  g += `<rect x="${L}" y="${T}" width="${W-L-R}" height="${y(2)-T}" fill="var(--unk-soft)" opacity=".6"/>`;
  [["축축",.3],["적정",1.4],["과건조",2.2]].forEach(([t, q]) => g += `<text x="${L-6}" y="${y(q)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${t}</text>`);
  // day ticks
  const d0 = new Date(t0); d0.setHours(24, 0, 0, 0);
  const span = (t1 - t0) / DAY, step = span > 7 ? 2 : 1;
  for(let t = d0.getTime(), k = 0; t < t1; t += DAY, k++){
    if(k % step) continue;
    const d = new Date(t);
    g += `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${Hh-B}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${x(t)}" y="${Hh-B+14}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.getMonth()+1}/${d.getDate()} ${WD[d.getDay()]}</text>`;
  }
  if(!P.terminal && pts.fast.length){
    const band = pts.fast.map(([t, q]) => `${x(t).toFixed(1)},${y(q).toFixed(1)}`).concat(pts.slow.slice().reverse().map(([t, q]) => `${x(t).toFixed(1)},${y(q).toFixed(1)}`)).join(" ");
    g += `<polygon points="${band}" fill="var(--terracotta)" opacity=".16"/>`;
    const past = pts.mid.filter(([t]) => t <= now), fut = pts.mid.filter(([t]) => t >= now);
    const line = arr => arr.map(([t, q], i) => `${i ? "L" : "M"}${x(t).toFixed(1)} ${y(q).toFixed(1)}`).join(" ");
    if(past.length > 1) g += `<path d="${line(past)}" fill="none" stroke="var(--terracotta)" stroke-width="2.2"/>`;
    if(fut.length > 1) g += `<path d="${line(fut)}" fill="none" stroke="var(--terracotta)" stroke-width="2.2" stroke-dasharray="5 4"/>`;
  }
  // storage marks
  storages(pot).forEach(e => { if(e.at >= t0 && e.at <= t1) g += `<path d="M${x(e.at)} ${Hh-B} v-6" stroke="var(--charcoal)" stroke-width="2"/><circle cx="${x(e.at)}" cy="${Hh-B-8}" r="3" fill="var(--charcoal)"/>`; });
  // observations
  observations(pot).forEach(o => {
    const L2 = OBS[o.level]; if(!L2) return;
    const q = L2.terminal ? 2.2 : L2.kind === "f" ? L2.r.mid : 1 + L2.r.mid;
    if(o.at >= t0 && o.at <= t1) g += `<circle cx="${x(o.at)}" cy="${y(q)}" r="5" fill="var(--card)" stroke="var(--sage)" stroke-width="2.5"/>`;
  });
  if(now >= t0 && now <= t1) g += `<line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${Hh-B}" stroke="var(--charcoal)" stroke-width="1.2" stroke-dasharray="2 3"/><text x="${x(now)}" y="${T-2}" text-anchor="middle" font-size="10" fill="var(--charcoal)">지금</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="건조 진행 예상 그래프">${g}</svg>`;
}

function detail(now){
  const pot = POTS.find(p => p.id === V.detail);
  if(!pot){ V.detail = null; return studio(now); }
  const P = predict(pot, now), s = P.state;
  const cur = P.cur || currentStorage(pot, now);
  const evs = (pot.events || []).slice().sort(byAt);
  const firstId = evs[0] && evs[0].id;
  let rows = `<li><div class="t">${fmt(pot.formedAt, pot.formedApproxH)}</div><div class="rail"><span class="nd"></span></div><div class="tx">🏺 탄생! <span class="sub">${CLAY[pot.clay] ? CLAY[pot.clay].lab : "모름"} 흙 · 두께 ${THICK[pot.thick] ? THICK[pot.thick].lab : "모름"}</span></div><div></div></li>`;
  evs.forEach(e => {
    let tx;
    if(e.type === "storage") tx = `${e.container === "none" ? "🌬️" : "📦"} ${esc(storageLabel(e))}<div class="sub">${e.orient && e.orient !== "unknown" && e.container !== "none" ? ORIENT[e.orient] + " · " : ""}${rateOf(e).ev}</div>`;
    else if(e.type === "obs") tx = `${OBS[e.level] ? OBS[e.level].e : "📝"} 직접 확인: ${OBS[e.level] ? OBS[e.level].lab : ""}${e.note ? `<div class="sub">${esc(e.note)}</div>` : ""}`;
    else if(e.type === "trim") tx = `🎉 굽깎기 완료${e.note ? `<div class="sub">${esc(e.note)}</div>` : ""}`;
    const del = e.id === firstId || READONLY ? "" : V.delEvent === e.id
      ? `<button class="icon-btn" style="color:var(--urgent)" data-act="delEvConfirm" data-ev="${esc(e.id)}">삭제 확인</button>`
      : `<button class="icon-btn" data-act="delEv" data-ev="${esc(e.id)}" aria-label="기록 지우기">지우기</button>`;
    rows += `<li><div class="t">${fmt(e.at, e.approxH)}</div><div class="rail"><span class="nd"></span></div><div class="tx">${tx}</div><div>${del}</div></li>`;
  });
  if(!P.terminal && !P.paused && P.conf !== "none"){
    if(P.tS.mid > now) rows += `<li class="future"><div class="t">${fmt(P.tS.mid)}</div><div class="rail"><span class="nd"></span></div><div class="tx">✨ 예상 굽깎기 적정 구간 시작<div class="sub">빠르면 ${fmt(P.tS.fast)} · 늦으면 ${fmt(P.tS.slow)}</div></div><div></div></li>`;
    if(P.tE.mid > now) rows += `<li class="future"><div class="t">${fmt(P.tE.mid)}</div><div class="rail"><span class="nd"></span></div><div class="tx">⚠️ 과건조 위험 증가<div class="sub">이후엔 바닥부터 단단해질 수 있어요</div></div><div></div></li>`;
  } else if(!P.terminal){
    rows += `<li class="future"><div class="t">?</div><div class="rail"><span class="nd"></span></div><div class="tx">❓ 다음 예측은 관찰 기록이 필요해요<div class="sub">${P.paused ? "꺼내는 시점부터 건조가 다시 진행돼요" : "상태를 기록하면 이 자리에 예상 구간이 그려져요"}</div></div><div></div></li>`;
  }
  const kindNote = cur && (pot.kind === "cup" || pot.kind === "bowl") && cur.orient !== "flip" && !P.terminal
    ? `<p class="note">바닥이 몸통보다 늦게 마를 수 있어요 (EXP-001). 확인할 때 바닥도 꼭 눌러 보세요.</p>` : "";
  const predTxt = P.terminal ? "—" : P.state === "UNKNOWN" ? `판단 보류 <span class="xs muted">(빠른 경우 ${ST[P.st.fast].lab} ~ 느린 경우 ${ST[P.st.slow].lab})</span>` : `${ST[s].lab}${P.recentObs ? "" : " 가능성"}`;
  return `<div class="detail-top"><button class="btn sm ghost" data-act="back">← 작업실</button><span class="xs muted">${esc(pot.exp || "")}</span></div>
  <section class="hero st-${s}">
    <div class="ch-wrap">${potSVG(pot.kind, s, {paused:P.paused})}</div>
    <h2>${esc(pot.name)}</h2>
    <div class="msg">${ST[s].e} ${ST[s].msg}</div>
    ${confPill(P)}
  </section>
  <section class="panel"><h3>현재 상태</h3><div class="kv">
    <span class="k">현재 예상 상태</span><span class="v">${predTxt}</span>
    <span class="k">마지막 실제 확인</span><span class="v">${P.lastObs ? `${fmt(P.lastObs.at, P.lastObs.approxH)} / ${OBS[P.lastObs.level] ? OBS[P.lastObs.level].lab : ""}` : "아직 없음"}</span>
    <span class="k">예측 신뢰도</span><span class="v">${P.terminal ? "—" : P.paused ? "밀폐 보관 중" : `<b class="conf-${P.conf}">${CONF[P.conf]}</b>`}</span>
    <span class="k">현재 보관</span><span class="v">${esc(storageLabel(cur))}</span>
    <span class="k">성형</span><span class="v">${fmt(pot.formedAt, pot.formedApproxH)} · ${KIND[pot.kind]}${pot.count ? ` ${pot.count}개` : ""}</span>
  </div>${pot.note ? `<p class="small muted" style="margin:10px 0 0">${esc(pot.note)}</p>` : ""}</section>
  <section class="panel st-${s}"><h3>굽깎기 최적 시간</h3>${windowBlock(pot, P, now, true)}</section>
  ${P.terminal ? "" : `<section class="panel"><h3>건조 진행 예상</h3><div class="chart-wrap">${chartSVG(pot, P, now)}</div>
    <div class="legend"><span><i style="background:var(--terracotta)"></i>중간 예상 (점선은 미래)</span><span><i style="background:var(--terracotta);opacity:.25"></i>빠른~느린 범위</span><span><i style="background:var(--sage-soft)"></i>굽깎기 적정</span><span>● 직접 확인</span></div></section>`}
  ${kindNote}
  <section class="panel"><h3>건조 타임라인</h3><ul class="tl">${rows}</ul></section>
  ${pot.status === "trimmed" || READONLY ? "" : `<div class="sticky-acts"><button class="btn" data-act="obs" data-id="${esc(pot.id)}">상태 기록하기</button><button class="btn" data-act="store" data-id="${esc(pot.id)}">보관 방법 변경</button></div>`}

function verdictOf(o){
  const ok = x => x === "READY" || x === "URGENT";
  if(ok(o.fast) && ok(o.mid) && ok(o.slow)) return ["v-good", "모델상 유력"];
  if(ok(o.mid)) return ["v-maybe", "가능성 있음"];
  if(ok(o.fast) || ok(o.slow)) return ["v-unsure", "불확실"];
  return ["v-no", "어려움"];
}
function tri(o){ return `<span class="tri" aria-label="빠름 ${ST[o.fast].lab}, 중간 ${ST[o.mid].lab}, 느림 ${ST[o.slow].lab}">${SC.map(s => `<span class="st-${o[s]}" title="${s}">${ST[o[s]].e}</span>`).join("")}</span>`; }
function planner(now){
  if(!V.planT){ const d = new Date(now + 2 * DAY); d.setHours(20, 0, 0, 0); V.planT = d.getTime(); }
  const T = V.planT;
  const active = POTS.filter(p => p.status !== "trimmed" && !predict(p, now).terminal);
  let items = "";
  for(const pot of active){
    const P = predict(pot, now);
    const opts = [];
    const keep = statesAt(pot, T, now); opts.push({nm:"지금 방식 그대로 두기", sub:storageLabel(P.cur), o:keep, visit:false});
    const cand = [
      {nm:"지금 오픈에어로 꺼내기", ch:{container:"none", seal:"partial", orient:"unknown"}},
      {nm:"지금 박스 부분 개방으로", ch:{container:"box", seal:"partial", orient:"flip"}},
      {nm:"지금 플라스틱 박스 밀폐로", ch:{container:"plastic", seal:"sealed", orient:"flip"}}
    ];
    for(const c of cand){
      if(P.cur && P.cur.container === c.ch.container && P.cur.seal === c.ch.seal) continue;
      opts.push({nm:c.nm, sub:rateOf(c.ch).ev, o:statesAt(whatIf(pot, [{at:now, ...c.ch}]), T, now), visit:true});
    }
    // two-step: open air until just inside window, then seal
    const open = whatIf(pot, [{at:now, container:"none", seal:"partial", orient:"unknown"}]);
    const scM = scenario(open, "mid", now);
    const X = crossT(scM, scM.R0 + .3 * (scM.R1 - scM.R0));
    if(isFinite(X) && X > now + H && X < T - 2 * H){
      const two = whatIf(pot, [{at:now, container:"none", seal:"partial", orient:"unknown"}, {at:X, container:"plastic", seal:"sealed", orient:"flip"}]);
      opts.push({nm:`오픈에어 → ${fmt(X)}에 밀폐`, sub:`적정에 막 들어선 때 밀폐해서 붙잡아 두는 방법. ${fmtShort(X)}에 한 번 더 방문해야 해요.`, o:statesAt(two, T, now), visit:true});
    }
    items += `<article class="plan-item st-${P.state}"><div class="plan-head"><div class="ch-wrap">${potSVG(pot.kind, P.state, {paused:P.paused, still:true})}</div><div><b>${esc(pot.name)}</b><div class="xs muted">${ST[P.state].lab} · ${P.paused ? "밀폐 보관 중" : "신뢰도 " + CONF[P.conf]}</div></div></div>
      ${opts.map(op => { const [vc, vt] = verdictOf(op.o); return `<div class="opt"><div class="nm">${esc(op.nm)}${op.visit ? ` <span class="xs muted">· 지금 방문 필요</span>` : ""}</div><div class="row" style="gap:6px">${tri(op.o)}<span class="verdict ${vc}">${vt}</span></div><div class="sub">${esc(op.sub)}</div></div>`; }).join("")}
    </article>`;
  }
  return `<header class="top"><div class="brand"><span class="eyebrow">목표 시점 역산</span><h1>언제 갈까?</h1><span class="tag">원하는 굽깎기 시간을 고르면 기물별로 맞출 수 있는 보관 방법을 보여줘요.</span></div></header>
  <section class="summary"><div class="field" style="margin:0"><label for="planT">굽깎고 싶은 시간</label><input type="datetime-local" id="planT" value="${toInput(T)}"></div>
  <div class="row xs muted" style="gap:10px"><span class="tri st-UNKNOWN"><span>빠름</span><span>중간</span><span>느림</span></span><span>세 칸은 빠르게·보통·느리게 마르는 경우에 그 시간의 예상 상태예요.</span></div></section>
  <p class="note">데이터가 아직 적어서 어떤 방법도 성공을 보장하지 않아요. 특히 부분 개방 박스와 스티로폼 밀폐는 실험 결과가 없어 범위가 넓어요. 작업실에 가기 전에 '모델상 유력'인지 먼저 보세요.</p>
  <div class="list" style="margin-top:12px">${items || `<p class="muted">계산할 기물이 없어요. 작업실에서 기물을 먼저 등록해 주세요.</p>`}</div>`;
}

function lab(now){
  const conds = [
    {nm:"오픈에어", ch:{container:"none"}},
    {nm:"박스 · 부분 개방", ch:{container:"box", seal:"partial"}},
    {nm:"박스 · 덮개 닫음", ch:{container:"box", seal:"closed"}},

    {nm:"플라스틱 · 완전 밀폐", ch:{container:"plastic", seal:"sealed"}},
    {nm:"기록 없음", ch:{container:"unknown"}}
  ];
  const G = {ok:["g-ok","근거 있음"], est:["g-est","추정"], unk:["g-unk","모름"]};
  const rateRows = conds.map(c => { const r = rateOf(c.ch); return `<tr><td>${c.nm}</td><td class="mono">${Math.round(r.lo*100)}~${Math.round(r.hi*100)}%</td><td><span class="grade ${G[r.grade][0]}">${G[r.grade][1]}</span><div class="xs muted">${esc(r.ev)}</div></td></tr>`; }).join("");
  // prediction log
  const OBS_R = {soaked:0, damp:1.5, ready:3, firm:4, over:5};
  const logs = [];
  POTS.forEach(p => observations(p).forEach(o => {
    if(!o.pred) { logs.push({p, o, res:"예측 전 기록", cls:"g-unk"}); return; }
    const r = OBS_R[o.level], lo = ST[o.pred.slow] ? ST[o.pred.slow].r : null, hi = ST[o.pred.fast] ? ST[o.pred.fast].r : null;
    let res, cls;
    if(lo === null || hi === null){ res = "판단 불가"; cls = "g-unk"; }
    else if(r < lo){ res = "예상보다 느림"; cls = "g-est"; }
    else if(r > hi){ res = "예상보다 빠름"; cls = "g-est"; }
    else { res = "예상 범위 안"; cls = "g-ok"; }
    logs.push({p, o, res, cls});
  }));
  logs.sort((a, b) => b.o.at - a.o.at);
  const inRange = logs.filter(l => l.res === "예상 범위 안").length, judged = logs.filter(l => l.cls !== "g-unk").length;
  const logHtml = logs.length ? `<div class="tbl-wrap"><table><thead><tr><th>기물 · 시각</th><th>직접 확인</th><th>예측과 비교</th></tr></thead><tbody>${logs.map(l => `<tr><td>${esc(l.p.name)}<div class="xs muted">${fmt(l.o.at, l.o.approxH)}</div></td><td>${OBS[l.o.level] ? OBS[l.o.level].e + " " + OBS[l.o.level].lab : ""}</td><td><span class="grade ${l.cls}">${l.res}</span></td></tr>`).join("")}</tbody></table></div>` : `<p class="small muted">아직 관찰 기록이 없어요.</p>`;

}

      ${USERS.length ? `<button type="button" class="btn ghost" style="justify-content:center" data-act="toPick">기존 사용자로 들어가기</button>` : ""}</form>`;
  } else {
    body = `<div class="users"><div class="center hint">누구의 작업실인가요?</div>
      ${USERS.map(u => `<button class="user-btn" data-act="pickUser" data-uid="${esc(u.id)}"><div class="ch-wrap">${potSVG(u.kind || "cup", "READY", {still:true})}</div><b>${esc(u.nick)}</b></button>`).join("")}
      <button class="btn" style="justify-content:center;padding:12px" data-act="toSignup">＋ 새 사용자</button></div>`;
  }
  return `<main class="login">${hero}${body}${privacy}</main>`;
}
function accountSheet(){
  return `<div class="sheet" role="dialog" aria-label="계정"><h2>${esc(USER.nick)}님</h2><p class="hint">기물 ${POTS.length}개 · ${fmt(USER.createdAt)}부터 사용</p>
    <div class="acct-list">
      <button class="btn" data-act="exportBk">📤 백업 파일로 내보내기</button>
      <label class="btn" for="bk-file" style="cursor:pointer">📥 백업 파일 가져오기</label><input type="file" id="bk-file" class="vh" accept="application/json,.json">
      <button class="btn" data-act="logout">🚪 로그아웃</button>
      <button class="btn" style="color:var(--urgent)" data-act="askDelUser">이 사용자와 기록 모두 삭제</button>
    </div>
    ${V.data.delUser ? `<form id="f-deluser" class="confirm-box" autocomplete="off">되돌릴 수 없어요. PIN을 입력하면 삭제돼요.
      <input class="pin-input" style="margin-top:8px" type="password" id="d-pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="PIN">
      <div class="row" style="margin-top:8px"><button type="submit" class="btn sm terra">삭제하기</button></div></form>` : ""}
    <p class="hint" style="margin-top:14px">기록은 이 기기에만 있어요. 홈 화면 앱을 지우거나 사파리 웹사이트 데이터를 지우면 같이 사라질 수 있으니 가끔 백업 파일을 저장해 두세요.</p>
    <div class="sheet-acts"><button class="btn" data-act="close">닫기</button></div></div>`;
}
function sheetHtml(){
  if(V.sheet === "account") return USER ? accountSheet() : "";
  const now = Date.now();
  if(V.sheet === "add") return `<form class="sheet" id="f-add" role="dialog" aria-label="기물 등록"><h2>새 기물 등록</h2><p class="hint">성형 직후에 등록하면 가장 정확해요.</p>
    <div class="field"><label for="a-name">이름</label><input type="text" id="a-name" required maxlength="30" placeholder="예: 보울 03" value=""></div>
    <div class="field"><span class="lab">종류</span>${segInput("a-kind", KIND, "cup")}</div>
    <div class="row" style="gap:12px"><div class="field" style="flex:1;min-width:120px"><label for="a-count">개수 (선택)</label><input type="number" id="a-count" min="1" max="50" placeholder="1"></div></div>
    <div class="field"><span class="lab">초기 흙 상태</span>${segInput("a-clay", {wet:"수분 많음", normal:"일반", unknown:"모름"}, "normal")}</div>
    <div class="field"><span class="lab">두께</span>${segInput("a-thick", {thin:"얇음", normal:"보통", thick:"두꺼움", unknown:"모름"}, "normal")}</div>
    ${timeFields("a-", now, "성형 시각")}
    <h3 style="margin-top:18px;font-size:16px">처음 보관 방법</h3>
    ${storageFields("a-", {container:"none", seal:"partial", orient:"up"})}
    <div class="field"><label for="a-note">메모 (선택)</label><textarea id="a-note" placeholder="흙 이름, 크기 등"></textarea></div>
    <div class="sheet-acts"><button type="button" class="btn" data-act="close">취소</button><button type="submit" class="btn primary">등록하기</button></div></form>`;
  const pot = POTS.find(p => p.id === V.data.id);
  if(!pot) return "";
  if(V.sheet === "obs") return `<form class="sheet" id="f-obs" role="dialog" aria-label="상태 기록"><h2>${esc(pot.name)} 상태 기록</h2><p class="hint">손끝으로 몸통과 바닥을 눌러 보고 가장 가까운 것을 골라 주세요.</p>
    ${timeFields("o-", now, "확인한 시각")}
    <div class="field"><span class="lab">지금 상태</span><div class="obs-opts">${Object.entries(OBS).map(([k, o], i) => `<input type="radio" name="o-level" id="o-${k}" value="${k}" ${i === 0 ? "required" : ""}><label for="o-${k}"><span class="e">${o.e}</span><b style="font-weight:500">${o.lab}</b><span class="s">${o.sub}</span></label>`).join("")}</div></div>
    <div class="field"><label for="o-note">메모 (선택)</label><textarea id="o-note" placeholder="예: 바닥이 더 축축함"></textarea></div>
    <div class="sheet-acts"><button type="button" class="btn" data-act="close">취소</button><button type="submit" class="btn primary">기록하기</button></div>
    <div style="margin-top:14px;text-align:center"><button type="button" class="btn sm terra" data-act="trim" data-id="${esc(pot.id)}">🎉 굽깎기를 완료했어요</button></div></form>`;
  if(V.sheet === "store"){
    const cur = currentStorage(pot) || {container:"none", seal:"partial", orient:"up"};
    return `<form class="sheet" id="f-store" role="dialog" aria-label="보관 방법 변경"><h2>보관 방법 변경</h2><p class="hint">지금: ${esc(storageLabel(cur))}. 바꾸면 타임라인에 새 기록이 추가돼요.</p>
    ${timeFields("s-", now, "옮긴 시각")}
    ${storageFields("s-", {container:cur.container, seal:cur.seal || "partial", orient:cur.orient || "up"})}
    <div class="sheet-acts"><button type="button" class="btn" data-act="close">취소</button><button type="submit" class="btn primary">변경하기</button></div></form>`;
  }
  return "";
}
function openSheet(name, data = {}){
  V.sheet = name; V.data = data;
  $sheet.innerHTML = `<div class="scrim" data-act="scrim">${sheetHtml()}</div>`;
  const first = $sheet.querySelector("input[type=text],input[type=radio]:checked,input");
  if(first) setTimeout(() => first.focus({preventScroll:true}), 30);
}
function closeSheet(){ V.sheet = null; $sheet.innerHTML = ""; }
const radio = (form, name) => { const el = form.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; };
function readStorage(form, prefix){
  const c = radio(form, prefix + "cont") || "unknown";
  return c === "none" ? {container:"none", seal:"partial", orient:"unknown"} : {container:c, seal:radio(form, prefix + "seal") || "unknown", orient:radio(form, prefix + "or") || "unknown"};
}

/* ───────── render ───────── */
function render(){
  if(!USER){ $app.innerHTML = loginScreen(); const f = document.getElementById("l-pin") || document.getElementById("u-nick"); if(f && !f.disabled) setTimeout(() => f.focus({preventScroll:true}), 30); return; }
  const now = Date.now();
  let html = V.detail ? detail(now) : V.tab === "plan" ? planner(now) : V.tab === "lab" ? lab(now) : studio(now);
  const tabs = [["studio","🏺","작업실"],["plan","🗓️","언제 갈까"],["lab","🧪","실험 노트"]];
  html += `<nav class="tabbar" aria-label="화면"><div class="in">${tabs.map(([k, i, l]) => `<button class="tab" data-act="tab" data-tab="${k}" ${V.tab === k && !V.detail ? 'aria-current="page"' : ""}><span class="ic" aria-hidden="true">${i}</span>${l}</button>`).join("")}</div></nav>`;
  const focusId = document.activeElement && document.activeElement.id;
  $app.innerHTML = html;
  if(focusId === "planT"){ const el = document.getElementById("planT"); if(el) el.focus(); }
}

/* ───────── events ───────── */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act === "scrim"){ if(ev.target === el) closeSheet(); return; }
  if(act !== "open") ev.stopPropagation();
  switch(act){
    case "open": V.detail = id; V.confirmDel = false; V.delEvent = null; render(); window.scrollTo(0, 0); break;
    case "back": V.detail = null; render(); break;
    case "tab": V.tab = el.dataset.tab; V.detail = null; render(); window.scrollTo(0, 0); break;
    case "add": if(!READONLY) openSheet("add"); break;
    case "obs": if(!READONLY) openSheet("obs", {id}); break;
    case "store": if(!READONLY) openSheet("store", {id}); break;
    case "close": closeSheet(); break;
    case "pickUser": LV.mode = "pin"; LV.uid = el.dataset.uid; LV.err = ""; render(); break;
    case "toSignup": LV.mode = "signup"; LV.err = ""; render(); break;
    case "toPick": LV.mode = "pick"; LV.err = ""; render(); break;
    case "account": openSheet("account", {}); break;
    case "logout": signOut(); break;
    case "askDelUser": V.data.delUser = true; $sheet.innerHTML = `<div class="scrim" data-act="scrim">${sheetHtml()}</div>`; { const d = document.getElementById("d-pin"); if(d) d.focus(); } break;
    case "exportBk": {
      const d = new Date(), name = `claygotchi-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
      const blob = new Blob([JSON.stringify({app:"claygotchi", v:1, exportedAt:Date.now(), pots:POTS}, null, 1)], {type:"application/json"});
      try {
        const file = new File([blob], name, {type:"application/json"});
        if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Claygotchi 백업"}); break; }
      } catch(e){ if(e && e.name === "AbortError") break; }
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); toast("백업 파일을 만들었어요."); break;
    }
    case "toggleDone": V.showDone = !V.showDone; render(); break;
    case "import": {
      const have = new Set(POTS.map(p => p.id));
      for(const p of exp002Pots()) if(!have.has(p.id)) await savePot(p);
      toast("EXP-002 컵과 보울을 가져왔어요."); break;
    }
    case "trim": {
      const pot = POTS.find(p => p.id === id); if(!pot) return;
      const c = JSON.parse(JSON.stringify(pot)); c.status = "trimmed"; c.events.push({id:uid(), type:"trim", at:Date.now()});
      closeSheet(); await savePot(c); toast("굽깎기 완료! 🎉"); break;
    }
    case "untrim": {
      const pot = POTS.find(p => p.id === id); if(!pot) return;
      const c = JSON.parse(JSON.stringify(pot)); c.status = "active"; c.events = c.events.filter(e => e.type !== "trim");
      await savePot(c); break;
    }
    case "askDel": V.confirmDel = true; render(); break;
    case "cancelDel": V.confirmDel = false; render(); break;
    case "delPot": V.detail = null; V.confirmDel = false; await removePot(id); toast("기물을 지웠어요."); break;
    case "delEv": V.delEvent = el.dataset.ev; render(); break;
    case "delEvConfirm": {
      const pot = POTS.find(p => p.id === V.detail); if(!pot) return;
      const c = JSON.parse(JSON.stringify(pot)); c.events = c.events.filter(e => e.id !== el.dataset.ev);
      if(!c.events.some(e => e.type === "trim")) c.status = "active";
      V.delEvent = null; await savePot(c); toast("기록을 지웠어요."); break;
    }
  }
});
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape" && V.sheet) closeSheet();
  if((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("card")){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.id === "bk-file" && t.files && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        const list = Array.isArray(d) ? d : d.pots;
        if(!Array.isArray(list)) throw 0;
        let n = 0;
        for(const p of list){
          if(!p || typeof p.id !== "string" || !Array.isArray(p.events) || typeof p.formedAt !== "number") continue;
          const i = POTS.findIndex(x => x.id === p.id);
          if(i < 0) { POTS.push(p); n++; }
          else if((p.updatedAt || 0) > (POTS[i].updatedAt || 0)) { POTS[i] = p; n++; }
        }
        saveLocal(); closeSheet(); render(); toast(n ? `기물 ${n}개를 가져왔어요.` : "새로 가져올 기록이 없어요.");
      } catch { toast("Claygotchi 백업 파일이 아니에요."); }
    };
    r.readAsText(t.files[0]); return;
  }
  if(t.id === "planT"){ const v = fromInput(t.value); if(isFinite(v)){ V.planT = v; render(); } return; }
  const m = t.name && t.name.match(/^(a-|s-)cont$/);
  if(m){ const hide = t.value === "none"; const f = t.form; f.querySelector("#" + m[1] + "sealRow").hidden = hide; f.querySelector("#" + m[1] + "orRow").hidden = hide; }
});
document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target, now = Date.now();
  const atOf = pre => { const v = fromInput(f.querySelector("#" + pre + "at").value); return isFinite(v) ? Math.min(v, now) : now; };
  const apxOf = pre => Number(f.querySelector("#" + pre + "apx").value) || 0;
  if(f.id === "f-login"){
    const u = USERS.find(x => x.id === LV.uid); if(!u) return;
    if(Date.now() < LV.lockUntil) return;
    const pin = f.querySelector("#l-pin").value;
    if(await hashPin(u.salt, pin) === u.hash) signIn(u, f.querySelector("#l-keep").checked);
    else {
      LV.fails++;
      if(LV.fails >= 5){ LV.lockUntil = Date.now() + 30000; LV.fails = 0; setTimeout(() => { if(!USER) render(); }, 30100); }
      LV.err = "PIN이 맞지 않아요."; render();
    }
    return;
  }
  if(f.id === "f-signup"){
    const nick = f.querySelector("#u-nick").value.trim(), pin = f.querySelector("#u-pin").value, pin2 = f.querySelector("#u-pin2").value;
    const fail = m => { LV.err = m; render(); const n = document.getElementById("u-nick"); if(n) n.value = nick; };
    if(!nick) return fail("닉네임을 입력해 주세요.");
    if(USERS.some(u => u.nick === nick)) return fail("이 기기에 같은 닉네임이 있어요.");
    if(!/^[0-9]{4}$/.test(pin)) return fail("PIN은 숫자 4자리예요.");
    if(pin !== pin2) return fail("두 PIN이 달라요.");
    const salt = randHex(16), kinds = ["cup","bowl","vase","plate","other"];
    const u = {id:"u" + randHex(8), nick, salt, hash:await hashPin(salt, pin), kind:kinds[USERS.length % kinds.length], createdAt:Date.now()};
    USERS.push(u);
    if(!lsSet(USERS_KEY, USERS)){ USERS.pop(); return fail("이 기기에 저장할 수 없어요. 사파리 개인정보 보호 모드인지 확인해 주세요."); }
    signIn(u, f.querySelector("#u-keep").checked); toast(`${nick}님의 작업실이 열렸어요.`);
    return;
  }
  if(f.id === "f-deluser"){
    const pin = f.querySelector("#d-pin").value;
    if(await hashPin(USER.salt, pin) !== USER.hash){ toast("PIN이 맞지 않아요."); return; }
    lsDel(potsKey(USER.id)); USERS = USERS.filter(u => u.id !== USER.id); lsSet(USERS_KEY, USERS);
    V.data = {}; signOut(); toast("사용자와 기록을 삭제했어요."); return;
  }
  if(f.id === "f-add"){
    const name = f.querySelector("#a-name").value.trim(); if(!name){ f.querySelector("#a-name").focus(); return; }
    const at = atOf("a-"), id = uid(), cnt = parseInt(f.querySelector("#a-count").value, 10);
    const pot = {id, name, kind:radio(f, "a-kind") || "other", clay:radio(f, "a-clay") || "unknown", thick:radio(f, "a-thick") || "unknown",
      count:isFinite(cnt) ? cnt : null, note:f.querySelector("#a-note").value.trim(), formedAt:at, formedApproxH:apxOf("a-"),
      status:"active", createdAt:now, events:[{id:uid(), type:"storage", at, approxH:apxOf("a-"), ...readStorage(f, "a-")}]};
    closeSheet(); await savePot(pot); V.detail = null; V.tab = "studio"; render(); toast(`${name} 탄생! 🏺`);
  }
  if(f.id === "f-obs"){
    const level = radio(f, "o-level"); if(!level){ toast("상태를 하나 골라 주세요."); return; }
    const pot = POTS.find(p => p.id === V.data.id); if(!pot) return;
    const at = atOf("o-"), P = predict(pot, at);
    const pred = P.st ? {fast:P.st.fast, mid:P.st.mid, slow:P.st.slow, state:P.state, conf:P.conf} : null;
    const c = JSON.parse(JSON.stringify(pot));
    c.events.push({id:uid(), type:"obs", at, approxH:apxOf("o-"), level, note:f.querySelector("#o-note").value.trim(), pred});
    closeSheet(); await savePot(c); toast("기록했어요. 예상 구간을 다시 계산했어요.");
  }
  if(f.id === "f-store"){
    const pot = POTS.find(p => p.id === V.data.id); if(!pot) return;
    const c = JSON.parse(JSON.stringify(pot));
    c.events.push({id:uid(), type:"storage", at:atOf("s-"), approxH:apxOf("s-"), ...readStorage(f, "s-")});
    closeSheet(); await savePot(c); toast("보관 방법을 바꿨어요.");
  }
});
setInterval(() => { if(!USER) return; if(document.activeElement && document.activeElement.id === "planT") return; render(); }, 60000);

/* ───────── boot ───────── */
function boot(){
  loadUsers();
  const cur = lsGet(CUR_KEY, null), u = USERS.find(x => x.id === cur);
  if(u) signIn(u, true);
  else { LV.mode = USERS.length ? "pick" : "signup"; render(); }
}
boot();
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body></html>
